StylesPath = .vale/styles

# Google's guide targets end-user product docs. Plugin documentation
# follows similar patterns, so a few rules are disabled where they misfire.
MinAlertLevel = warning

# Identifiers live in inline code. Vale's spelling and term checks
# should not rewrite them.
IgnoredScopes = code, tt

# Fetched by `vale sync` (mise run lint-prose-sync) and gitignored: style
# packages are pinned dependencies, not source. Only the vocabulary is tracked.
Packages = Google

Vocab = Kubecost

[*.md]
BasedOnStyles = Vale, Google

# --- disabled: conflicts with house voice ---

# Wants word—word. Plugin docs use spaced em dashes.
Google.EmDash = NO

# Wants sentence-case headings. Headings use Title Case.
Google.Headings = NO

# Falls out of heading style plus code/step patterns.
Google.Colons = NO

# Instructions legitimately describe what commands will do.
Google.Will = NO

# Documentation uses first person ("I", "we", "you").
Google.We = NO
Google.FirstPerson = NO

# Bans "CLI" in favor of "command-line tool", but "CLI" is standard here.
Google.WordList = NO
