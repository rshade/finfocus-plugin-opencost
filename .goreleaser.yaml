version: 2

project_name: finfocus-plugin-opencost

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.Version={{.Version}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.BuildDate={{.Date}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitCommit={{.Commit}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitBranch={{.Branch}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitState={{if .Dirty}}dirty{{else}}clean{{end}}
    binary: finfocus-plugin-opencost
    main: ./cmd/finfocus-plugin-opencost

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
      - plugin.manifest.json
      - config.example.yaml

dockers_v2:
  - images:
      - ghcr.io/rshade/finfocus-plugin-opencost
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.example.yaml
      - plugin.manifest.json

homebrew_casks:
  - name: finfocus-plugin-opencost
    homepage: "https://github.com/rshade/finfocus-plugin-opencost"
    description: "FinFocus OpenCost cost source, with a kubecost allocation profile"
    repository:
      owner: rshade
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com
    binaries:
      - finfocus-plugin-opencost

nfpms:
  - maintainer: "rshade <rshade@example.com>"
    description: "FinFocus OpenCost cost source, with a kubecost allocation profile"
    homepage: "https://github.com/rshade/finfocus-plugin-opencost"
    license: "MIT"
    formats:
      - deb
      - rpm
    contents:
      - src: config.example.yaml
        dst: /etc/finfocus/opencost/config.example.yaml
      - src: plugin.manifest.json
        dst: /etc/finfocus/opencost/plugin.manifest.json
    scripts:
      postinstall: scripts/postinstall.sh
      postremove: scripts/postremove.sh

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto

dist: dist
