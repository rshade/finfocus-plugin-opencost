version: 2

project_name: finfocus-plugin-opencost

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.Version={{.Version}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.BuildDate={{.Date}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitCommit={{.Commit}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitBranch={{.Branch}}
      - -X github.com/rshade/finfocus-plugin-opencost/pkg/version.GitState={{ .GitTreeState }}
    binary: finfocus-plugin-opencost
    main: ./cmd/finfocus-plugin-opencost

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
      - plugin.manifest.json
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto

dist: dist
