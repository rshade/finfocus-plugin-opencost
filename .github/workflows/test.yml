name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    # No Go matrix: go.mod declares one supported Go version.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Publish coverage summary
        run: |
          {
            echo "### Coverage"
            echo
            echo "Total statement coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
            echo
            echo "| Package | Statements covered |"
            echo "| --- | --- |"
            awk 'NR > 1 { split($1, a, ":"); dir = a[1]; sub(/\/[^\/]*$/, "", dir); total[dir] += $2; if ($3 > 0) hit[dir] += $2 } END { for (dir in total) printf "| %s | %.1f%% |\n", dir, 100 * hit[dir] / total[dir] }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Build plugin image
        run: docker build -t finfocus-plugin-opencost:dev .

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Run govulncheck
        # grpc is on a stable tag past the GO-2026-6443 fix. A finding fails this job.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_only: true
          install_args: node npm:@fission-ai/openspec

      - name: Validate specs
        run: mise exec -- openspec validate --all --strict
