name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build plugin image
        run: docker build -t finfocus-plugin-opencost:dev .

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Run govulncheck
        # grpc v1.86.0-dev is the published fix for GO-2026-6443. A finding fails this job.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
