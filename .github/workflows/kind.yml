name: Kind

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (kind)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'e2e-kind'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run kind e2e
        run: make e2e-kind

      - name: Export cluster logs
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/oc-e2e-logs"
          kind export logs "${RUNNER_TEMP}/oc-e2e-logs" --name oc-e2e || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oc-e2e-logs
          path: ${{ runner.temp }}/oc-e2e-logs
          if-no-files-found: ignore
