name: Kind

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  paths:
    name: Paths
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.sel.outputs.e2e }}
    steps:
      - name: Checkout path selector
        if: github.event_name == 'pull_request' && github.event.action != 'labeled'
        uses: actions/checkout@v7

      - name: Select pull request paths
        id: sel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ] || [ "${EVENT_ACTION}" = "labeled" ]; then
            echo "e2e=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            | bash hack/kind/select-pr-paths.sh
          then
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e=false" >> "${GITHUB_OUTPUT}"
          fi

  e2e:
    name: E2E (kind)
    needs: paths
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.label.name == 'e2e-kind' ||
       needs.paths.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Build plugin image
        run: docker build -t finfocus-plugin-opencost:dev .

      - name: Smoke-run plugin help
        run: |
          set +e
          docker run --rm finfocus-plugin-opencost:dev --help >"${RUNNER_TEMP}/plugin-help.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/plugin-help.txt"
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 2 ]; then
            exit "${code}"
          fi
          grep -F -- '-version' "${RUNNER_TEMP}/plugin-help.txt"
          grep -F -- '-port' "${RUNNER_TEMP}/plugin-help.txt"

      - name: Run kind e2e
        env:
          OC_KEEP_FAILED_CLUSTER: "1"
        run: make e2e-kind

      - name: Export cluster logs
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/oc-e2e-logs"
          kind export logs "${RUNNER_TEMP}/oc-e2e-logs" --name oc-e2e || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oc-e2e-logs
          path: ${{ runner.temp }}/oc-e2e-logs
          if-no-files-found: ignore
