name: Kind

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (kind)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'e2e-kind'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Build plugin image
        run: docker build -t finfocus-plugin-opencost:dev .

      - name: Smoke-run plugin help
        run: |
          set +e
          docker run --rm finfocus-plugin-opencost:dev --help >"${RUNNER_TEMP}/plugin-help.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/plugin-help.txt"
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 2 ]; then
            exit "${code}"
          fi
          grep -F -- '-version' "${RUNNER_TEMP}/plugin-help.txt"
          grep -F -- '-port' "${RUNNER_TEMP}/plugin-help.txt"

      - name: Run kind e2e
        env:
          OC_KEEP_FAILED_CLUSTER: "1"
        run: make e2e-kind

      - name: Export cluster logs
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/oc-e2e-logs"
          kind export logs "${RUNNER_TEMP}/oc-e2e-logs" --name oc-e2e || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oc-e2e-logs
          path: ${{ runner.temp }}/oc-e2e-logs
          if-no-files-found: ignore
