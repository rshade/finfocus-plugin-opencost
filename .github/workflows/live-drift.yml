name: Live drift

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Live key set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OC_DRIFT_CLUSTER: oc-drift
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install the latest OpenCost chart
        env:
          OC_KEEP_FAILED_CLUSTER: "1"
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/oc-drift.kubeconfig"
          echo "KUBECONFIG=${KUBECONFIG}" >> "${GITHUB_ENV}"
          bash hack/drift/live-up.sh

      - name: Compare allocation keys
        id: compare
        run: |
          set +e
          bash hack/drift/live-compare.sh > "${RUNNER_TEMP}/drift.txt" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/drift.txt"
          exit "${code}"

      - name: Open or update one drift issue
        if: failure() && steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash hack/drift/open-issue.sh < "${RUNNER_TEMP}/drift.txt"

      - name: Export cluster logs
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/oc-drift-logs"
          kind export logs "${RUNNER_TEMP}/oc-drift-logs" --name oc-drift || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oc-drift-logs
          path: ${{ runner.temp }}/oc-drift-logs
          if-no-files-found: ignore

      - name: Delete drift cluster
        if: always()
        run: kind delete cluster --name oc-drift --kubeconfig "${KUBECONFIG}" || true
