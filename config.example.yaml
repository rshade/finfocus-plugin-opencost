baseUrl: https://opencost.example.com
profile: opencost
currency: EUR
defaultWindow: 30d
timeout: 15s
tlsSkipVerify: false
allowInsecureHttp: false
caCertFile: ""
cacheTTL: 30s
requestsPerSecond: 10
rateBurst: 20
includeUsage: false
recommendations: false
# Required when recommendations is true: the fraction above average usage to keep (0.2 = 20%).
recommendationHeadroom: 0.2
clusterId: production-cluster
defaultNamespace: default
predictionWindow: 2d
# Reach OpenCost through the Kubernetes API server service proxy instead of
# baseUrl. Set a service and remove baseUrl, tlsSkipVerify, caCertFile, and
# allowInsecureHttp. An empty service keeps baseUrl mode.
kube:
  context: ""
  namespace: opencost
  service: ""
  port: 9003
  kubeconfig: ""
