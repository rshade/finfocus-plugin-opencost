apiVersion: v1
kind: Namespace
metadata: {name: oc-test}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fixed, namespace: oc-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: fixed}}
  template:
    metadata: {labels: {app: fixed}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 500m, memory: 512Mi}
