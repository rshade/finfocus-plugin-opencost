apiVersion: v1
kind: Namespace
metadata: {name: oc-test}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fixed, namespace: oc-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: fixed}}
  template:
    metadata: {labels: {app: fixed}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
# A DaemonSet in its own namespace, so the oc-test namespace oracle in
# testdata/opencost-real/expected.json keeps its inputs. The e2e oracle reads
# these requests from this file.
apiVersion: v1
kind: Namespace
metadata: {name: oc-test-ds}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: daemon, namespace: oc-test-ds}
spec:
  selector: {matchLabels: {app: daemon}}
  template:
    metadata: {labels: {app: daemon}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: 250m, memory: 256Mi}
